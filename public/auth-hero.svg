<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Ilustrasi langit dan taman">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6cb0"/>
      <stop offset="0.55" stop-color="#78c7ff"/>
      <stop offset="1" stop-color="#c8f1ff"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ad36b"/>
      <stop offset="1" stop-color="#4aa349"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="640" fill="url(#sky)"/>

  <!-- Clouds -->
  <g opacity="0.95" filter="url(#soft)">
    <g fill="#fff">
      <ellipse cx="190" cy="170" rx="120" ry="56"/>
      <ellipse cx="285" cy="170" rx="88" ry="48"/>
      <ellipse cx="120" cy="182" rx="88" ry="44"/>
      <ellipse cx="225" cy="135" rx="92" ry="46"/>
    </g>
    <g fill="#fff" opacity="0.95">
      <ellipse cx="600" cy="210" rx="130" ry="58"/>
      <ellipse cx="520" cy="226" rx="92" ry="44"/>
      <ellipse cx="690" cy="230" rx="98" ry="46"/>
      <ellipse cx="610" cy="175" rx="92" ry="46"/>
    </g>
    <g fill="#fff" opacity="0.9">
      <ellipse cx="320" cy="330" rx="110" ry="48"/>
      <ellipse cx="250" cy="342" rx="80" ry="38"/>
      <ellipse cx="395" cy="345" rx="82" ry="40"/>
    </g>
  </g>

  <!-- Distant haze -->
  <rect y="560" width="800" height="80" fill="#ffffff" opacity="0.18"/>

  <!-- Field -->
  <rect y="640" width="800" height="360" fill="url(#field)"/>

  <!-- Flowers strip -->
  <g opacity="0.95">
    <rect y="770" width="800" height="48" fill="#2f855a" opacity="0.25"/>
    <g fill="#e11d48" opacity="0.85">
      <circle cx="80" cy="792" r="5"/><circle cx="120" cy="806" r="4"/><circle cx="160" cy="792" r="4"/>
      <circle cx="210" cy="808" r="5"/><circle cx="260" cy="792" r="4"/><circle cx="310" cy="808" r="4"/>
      <circle cx="360" cy="792" r="4"/><circle cx="410" cy="808" r="5"/><circle cx="460" cy="792" r="4"/>
      <circle cx="520" cy="808" r="4"/><circle cx="570" cy="792" r="4"/><circle cx="620" cy="808" r="5"/>
      <circle cx="680" cy="792" r="4"/><circle cx="730" cy="808" r="4"/>
    </g>
  </g>

  <!-- Simple building hint -->
  <g filter="url(#shadow)">
    <rect x="560" y="700" width="180" height="96" rx="6" fill="#f8fafc"/>
    <rect x="560" y="690" width="180" height="18" fill="#e2e8f0"/>
    <rect x="586" y="725" width="36" height="26" fill="#cbd5e1"/>
    <rect x="636" y="725" width="36" height="26" fill="#cbd5e1"/>
    <rect x="686" y="725" width="36" height="26" fill="#cbd5e1"/>
    <rect x="620" y="760" width="60" height="36" fill="#94a3b8"/>
  </g>

  <!-- Small flag -->
  <g>
    <rect x="500" y="708" width="4" height="130" fill="#64748b"/>
    <path d="M504 712 h62 v18 h-62 z" fill="#ef4444"/>
    <path d="M504 730 h62 v18 h-62 z" fill="#ffffff"/>
  </g>

  <!-- Subtle bottom stone border -->
  <path d="M0 930 C150 900 260 910 380 940 C510 970 640 970 800 940 L800 1000 L0 1000 Z" fill="#94a3b8" opacity="0.25"/>
</svg>
